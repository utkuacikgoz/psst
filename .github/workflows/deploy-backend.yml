name: Deploy backend

# Manual only: deploying changes a live service. Choose the target when running.
#
# Repository secrets (Settings → Secrets and variables → Actions) serve development:
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    the xxxx in xxxx.supabase.co (development project)
#   SUPABASE_DB_PASSWORD    that project's database password
#   APNS_TEAM_ID, APNS_KEY_ID, APNS_BUNDLE_ID, APNS_PRIVATE_KEY (full .p8 contents)
# Production uses its own secrets, with a _PROD suffix, as repository secrets or
# on the "production" environment (which can also require an approval):
#   SUPABASE_PROJECT_REF_PROD, SUPABASE_DB_PASSWORD_PROD   (required)
#   SUPABASE_ACCESS_TOKEN_PROD   (only if production is in another Supabase account)
# A production run never falls back to the development project. The APNs key is
# shared: APNs itself separates sandbox and production device tokens.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which backend to deploy
        type: choice
        options: [development, production]
        default: development

concurrency:
  group: deploy-backend-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/backend.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 20
    env:
      TARGET: ${{ inputs.target }}
      SUPABASE_ACCESS_TOKEN: ${{ inputs.target == 'production' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ inputs.target == 'production' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD }}
      PROD_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      PROD_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that every secret is set
        env:
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD \
                      APNS_TEAM_ID APNS_KEY_ID APNS_BUNDLE_ID APNS_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set for ${{ inputs.target }}"; missing=1; fi
          done
          # Production must never fall back to the development project.
          if [ "$TARGET" = production ]; then
            if [ -z "$PROD_REF" ]; then echo "::error::SUPABASE_PROJECT_REF_PROD is not set"; missing=1; fi
            if [ -z "$PROD_PASSWORD" ]; then echo "::error::SUPABASE_DB_PASSWORD_PROD is not set"; missing=1; fi
          fi
          echo "Deploying to $TARGET."
          # Accept the whole .p8 file or just its base64 body; reject anything else.
          body=$(sed '/-----/d' <<<"$APNS_PRIVATE_KEY" | tr -d ' \r\n\t')
          if ! [[ "$body" =~ ^[A-Za-z0-9+/]+=*$ ]] || [ ${#body} -lt 150 ] || [ ${#body} -gt 400 ]; then
            echo "::error::APNS_PRIVATE_KEY doesn't look like an APNs key. Paste the full text of the AuthKey_XXXXXXXXXX.p8 file (about 200 characters between the BEGIN and END lines)."
            missing=1
          fi
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Set function secrets
        env:
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          # Normalize to PEM whichever form was pasted.
          body=$(sed '/-----/d' <<<"$APNS_PRIVATE_KEY" | tr -d ' \r\n\t')
          pem=$(printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----' "$(fold -w 64 <<<"$body")")
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            APNS_TEAM_ID="$APNS_TEAM_ID" \
            APNS_KEY_ID="$APNS_KEY_ID" \
            APNS_BUNDLE_ID="$APNS_BUNDLE_ID" \
            APNS_PRIVATE_KEY="$pem" > /dev/null
          echo "Secrets set (values not printed)."

      - name: Deploy functions
        run: |
          supabase functions deploy send-signal --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"

      - name: Smoke test the deployed backend
        run: |
          SUPABASE_ANON_KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | python3 -c "
          import json, sys
          keys = json.load(sys.stdin)
          pick = next((k for k in keys if k.get('name') == 'anon'), None) \
              or next((k for k in keys if k.get('type') == 'publishable'), None)
          print(pick['api_key'] if pick else '')
          ")
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::Couldn't read the project's anon key"; exit 1; fi
          echo "::add-mask::$SUPABASE_ANON_KEY"
          SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" python3 scripts/smoke_live.py
