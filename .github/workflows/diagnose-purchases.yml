name: Diagnose purchases

# Manual, Linux only. Prints why verify-plus refused purchases recently (the
# reasons it records server-side; never proofs or keys), and checks that Apple's
# certificate-status service answers from a server.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which backend
        type: choice
        options: [production, development]
        default: production

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ inputs.target == 'production' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apple certificate status check from a server
        continue-on-error: true
        run: deno run --allow-all scripts/check_apple_ocsp.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Recent verify-plus failures
        run: python3 scripts/diagnose_purchases.py
      - name: How long sends take (last 24 h)
        if: always()
        run: python3 scripts/send_latency.py
