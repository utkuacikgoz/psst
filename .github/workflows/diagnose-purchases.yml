name: Diagnose purchases

# Manual, Linux only. Prints why verify-plus refused purchases recently (the
# reasons it records server-side; never proofs or keys), and checks that Apple's
# certificate-status service answers from a server.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which backend
        type: choice
        options: [production, development]
        default: production

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ inputs.target == 'production' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Apple certificate status check from a server
        continue-on-error: true
        run: deno run --allow-all scripts/check_apple_ocsp.ts
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1  # v3 changed db push flags; move deliberately
      - name: Recent verify-plus failures
        run: python3 scripts/diagnose_purchases.py
      - name: How long a Psst send takes (two temporary accounts)
        if: always()
        run: |
          SUPABASE_ANON_KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | python3 -c "
          import json, sys
          keys = json.load(sys.stdin)
          pick = next((k for k in keys if k.get('name') == 'anon'), None) \
              or next((k for k in keys if k.get('type') == 'publishable'), None)
          print(pick['api_key'] if pick else '')
          ")
          echo "::add-mask::$SUPABASE_ANON_KEY"
          SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" python3 scripts/send_timing.py
