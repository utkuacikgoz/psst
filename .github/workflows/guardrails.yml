name: Guardrails

# 1. Owner-approved features and designs must not disappear in a merge.
# 2. Every design change must carry the owner's approval (Design-Approved: trailer).
# 3. The sitemap's dates follow the pages' last commits.
# Linux only: seconds, and no macOS minutes.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  owner-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 scripts/check_owner_decisions.py

  design-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Every design change is owner-approved
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/check_design_approval.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            python3 scripts/check_design_approval.py "${{ github.event.before }}" "${{ github.sha }}"
          fi

  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - run: python3 scripts/sitemap.py --check
