name: iOS build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build and run unit tests
        run: |
          UDID=$(python3 scripts/pick_simulators.py any)
          set -o pipefail
          xcodebuild test \
            -project Psst.xcodeproj -scheme Psst \
            -destination "id=$UDID" \
            -only-testing:PsstTests \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Capture screenshots on a compact and a large iPhone
        run: |
          set -o pipefail
          for kind in compact large; do
            UDID=$(python3 scripts/pick_simulators.py "$kind")
            xcodebuild test \
              -project Psst.xcodeproj -scheme Psst \
              -destination "id=$UDID" \
              -only-testing:PsstUITests \
              -resultBundlePath "results-$kind.xcresult" \
              CODE_SIGNING_ALLOWED=NO
            python3 scripts/export_screenshots.py "results-$kind.xcresult" screenshots
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
