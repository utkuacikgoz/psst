name: iOS

# Unit tests: on pushes to main that touch the app, and on pull requests.
# Screenshots: only when run by hand (Actions → iOS → Run workflow). One job,
# one phone; the images replace the single commit on the `screenshots` branch.
on:
  push:
    branches: [main]
    paths: ["Psst/**", "PsstTests/**", "Psst.xcodeproj/**", "Config/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["Psst/**", "PsstTests/**", "PsstUITests/**", "Psst.xcodeproj/**", "Config/**"]
  workflow_dispatch:
    inputs:
      tests:
        description: "UI tests to capture (e.g. PsstUITests/AppStoreScreenshotTests/testPsstPlusUnlocked)"
        default: PsstUITests/AppStoreScreenshotTests
      text_size:
        description: Text size
        type: choice
        options: [standard, largest]
        default: standard

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: scripts/select_xcode.sh
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project Psst.xcodeproj -scheme Psst \
            -destination "id=$(python3 scripts/pick_simulators.py any)" \
            -only-testing:PsstTests CODE_SIGNING_ALLOWED=NO

  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: scripts/select_xcode.sh
      - name: Capture
        run: |
          set -o pipefail
          UDID=$(python3 scripts/pick_simulators.py large)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          [ "${{ inputs.text_size }}" = largest ] && size=accessibility-extra-extra-extra-large || size=large
          xcrun simctl ui "$UDID" content_size "$size"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4 --operatorName ""
          status=0
          TEST_RUNNER_PSST_SIZE_LABEL="${{ inputs.text_size }}" xcodebuild test \
            -project Psst.xcodeproj -scheme Psst -destination "id=$UDID" \
            -only-testing:"${{ inputs.tests }}" \
            -resultBundlePath results.xcresult CODE_SIGNING_ALLOWED=NO || status=1
          python3 scripts/export_screenshots.py results.xcresult shots || true
          exit $status
      - name: Publish to the screenshots branch
        if: always()
        run: |
          [ -n "$(ls shots/*.png 2>/dev/null)" ] || { echo "No screenshots."; exit 0; }
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA::7} [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
