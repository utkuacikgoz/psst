name: iOS build and tests

# Unit tests run on pushes to main and on pull requests that touch the app.
# Screenshots are costly (four simulator runs), so they run only when asked
# for (Actions → iOS build and tests → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "Psst/**"
      - "PsstTests/**"
      - "PsstUITests/**"
      - "Psst.xcodeproj/**"
      - "Config/**"
      - "scripts/select_xcode.sh"
      - "scripts/pick_simulators.py"
      - "scripts/export_screenshots.py"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Psst/**"
      - "PsstTests/**"
      - "PsstUITests/**"
      - "Psst.xcodeproj/**"
      - "Config/**"
      - "scripts/select_xcode.sh"
      - "scripts/pick_simulators.py"
      - "scripts/export_screenshots.py"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      appstore:
        description: "App Store screenshots (full-size 6.9\" PNGs) instead of the review set"
        type: boolean
        default: false

# One iOS run per branch at a time: a newer push or manual run cancels the
# older one, so macOS runners never stack up.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # A manual run is for screenshots; its UI-test shards build the app anyway.
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: scripts/select_xcode.sh
      - name: Build and run unit tests
        run: |
          UDID=$(python3 scripts/pick_simulators.py any)
          set -o pipefail
          xcodebuild test \
            -project Psst.xcodeproj -scheme Psst \
            -destination "id=$UDID" \
            -only-testing:PsstTests \
            CODE_SIGNING_ALLOWED=NO

  # One shard per phone and text size, in parallel.
  screenshots:
    if: github.event_name == 'workflow_dispatch' && !inputs.appstore
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phone: [compact, large]
        size: ["large:standard", "accessibility-extra-extra-extra-large:ax-xxxl"]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: scripts/select_xcode.sh
      - name: Capture screenshots
        run: |
          set -o pipefail
          SIZE="${{ matrix.size }}"
          UDID=$(python3 scripts/pick_simulators.py "${{ matrix.phone }}")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" content_size "${SIZE%%:*}"
          status=0
          TEST_RUNNER_PSST_SIZE_LABEL="${SIZE##*:}" xcodebuild test \
            -project Psst.xcodeproj -scheme Psst \
            -destination "id=$UDID" \
            -only-testing:PsstUITests/ScreenshotTests \
            -only-testing:PsstUITests/LiveScreenshotTests \
            -resultBundlePath results.xcresult \
            CODE_SIGNING_ALLOWED=NO || status=1
          # Export whatever was captured, even if a later step failed.
          python3 scripts/export_screenshots.py results.xcresult screenshots || true
          # Small JPEG review copies; the PNGs are discarded.
          mkdir -p review
          for f in screenshots/*.png; do
            [ -e "$f" ] || continue
            name=$(basename "${f%.png}" | tr ' ' '-' | tr -d '()')
            sips -s format jpeg -s formatOptions 70 --resampleWidth 540 "$f" --out "review/$name.jpg" >/dev/null \
              || echo "::warning::Skipped unreadable image $f"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-${{ matrix.phone }}-${{ strategy.job-index }}
          path: review
          if-no-files-found: warn
          retention-days: 1

  # Full-resolution App Store screenshots on the 6.9" iPhone, with Apple's
  # clean status bar (9:41, full battery).
  appstore-screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.appstore
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: scripts/select_xcode.sh
      - name: Capture App Store screenshots
        run: |
          set -o pipefail
          UDID=$(python3 scripts/pick_simulators.py large)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" content_size large
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4 --operatorName ""
          xcodebuild test \
            -project Psst.xcodeproj -scheme Psst \
            -destination "id=$UDID" \
            -only-testing:PsstUITests/AppStoreScreenshotTests \
            -resultBundlePath appstore.xcresult \
            CODE_SIGNING_ALLOWED=NO
          python3 scripts/export_screenshots.py appstore.xcresult exported
          mkdir -p appstore
          for f in exported/*.png; do
            cp "$f" "appstore/$(basename "$f" | sed 's/^appstore__6.9__//')"
          done
          sips -g pixelWidth -g pixelHeight appstore/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: appstore
          path: appstore
          retention-days: 1

  # Replaces the single commit on the `screenshots` branch, so old images never
  # pile up in history or on main.
  publish-screenshots:
    needs: [screenshots, appstore-screenshots]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.appstore }}
        with:
          pattern: review-*
          path: review
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ inputs.appstore }}
        with:
          name: appstore
          path: review/appstore
      - name: Force-push the screenshots branch
        run: |
          [ -d review ] && [ -n "$(ls -A review)" ] || { echo "No screenshots to publish."; exit 0; }
          cd review
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7} [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
