name: iOS build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build and run unit tests
        run: |
          UDID=$(python3 scripts/pick_simulators.py any)
          set -o pipefail
          xcodebuild test \
            -project Psst.xcodeproj -scheme Psst \
            -destination "id=$UDID" \
            -only-testing:PsstTests \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Capture screenshots on a compact and a large iPhone
        run: |
          set -o pipefail
          status=0
          for kind in compact large; do
            UDID=$(python3 scripts/pick_simulators.py "$kind")
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            for size in large:standard accessibility-extra-extra-extra-large:ax-xxxl; do
              xcrun simctl ui "$UDID" content_size "${size%%:*}"
              TEST_RUNNER_PSST_SIZE_LABEL="${size##*:}" xcodebuild test \
                -project Psst.xcodeproj -scheme Psst \
                -destination "id=$UDID" \
                -only-testing:PsstUITests \
                -resultBundlePath "results-$kind-${size##*:}.xcresult" \
                CODE_SIGNING_ALLOWED=NO || status=1
              # Export whatever was captured, even if a later step failed.
              python3 scripts/export_screenshots.py "results-$kind-${size##*:}.xcresult" screenshots || true
            done
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - name: Commit review copies (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          rm -rf docs/screenshots && mkdir -p docs/screenshots
          for f in screenshots/*.png; do
            name=$(basename "${f%.png}" | tr ' ' '-' | tr -d '()')
            sips -s format jpeg -s formatOptions 70 --resampleWidth 540 "$f" --out "docs/screenshots/$name.jpg" >/dev/null \
              || echo "::warning::Skipped unreadable image $f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Update screenshots from CI [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
