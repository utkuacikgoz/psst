name: Publish privacy and support pages

# Manual only: publishing is public. Before the first run, enable
# Settings → Pages → Source: GitHub Actions, and replace SUPPORT_EMAIL in site/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish placeholders
        run: |
          if grep -rl "SUPPORT_EMAIL" site; then
            echo "::error::Replace SUPPORT_EMAIL in the files above before publishing."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
