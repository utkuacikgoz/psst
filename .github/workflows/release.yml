name: Release to App Store

# Manual, Linux only. Puts a processed build up for App Store review: creates
# the version, attaches the build, fills What's New and the review notes from
# docs/APP_REVIEW_NOTES.md (the "## <version> (" section), replaces the App
# Store screenshots with brand/appstore unless told to keep them. "prepare" stops
# before sending; "submit" sends it to App Review; "promo" only updates the
# promotional text from docs/ASO.md, which Apple lets change at any time.
# When the notes hold {REVIEW_CODE} / {BACKUP_CODE}, scripts/review_codes.py makes
# fresh Psst Team codes in production through the Supabase Management API and
# fills them in; they're masked and only App Store Connect sees them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version, e.g. 1.0.7 (not needed for promo)
        required: false
      build:
        description: Build number (the TestFlight run number), e.g. 37 (not needed for promo)
        required: false
      mode:
        description: prepare (fill everything), submit (also send for review) or promo (only the promotional text, live now)
        type: choice
        options: [prepare, submit, promo]
        default: prepare
      screenshots:
        description: upload (replace the App Store screenshots with brand/appstore) or keep
        type: choice
        options: [upload, keep]
        default: upload
      review_account:
        description: Display name of the account App Review connects to (only when no earlier review code points at it)
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
      MODE: ${{ inputs.mode }}
      SCREENSHOTS: ${{ inputs.screenshots }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      REVIEW_ACCOUNT: ${{ inputs.review_account }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q pyjwt cryptography
      - run: python3 scripts/test_review_codes.py
      - run: python3 scripts/release.py
