name: Report alerts

# Hourly, Linux only (owner pick 12A): tells the owner about new reports by
# opening one GitHub issue per run. This repo is public, so the issue holds only
# report ids, times and whether a doodle was kept: no names, no drawings. The
# details are read in Supabase. Reports are marked notified only after the issue
# exists, so a failed run alerts again next hour instead of never.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: report-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { SUPABASE_ACCESS_TOKEN: token, SUPABASE_PROJECT_REF: ref } = process.env;
            if (!token || !ref) {
              core.setFailed("Set SUPABASE_ACCESS_TOKEN(_PROD) and SUPABASE_PROJECT_REF_PROD on the production environment.");
              return;
            }
            const sql = async (query) => {
              const res = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ query }),
              });
              // Never print the body: it could quote rows.
              if (!res.ok) throw new Error(`Supabase refused the report query (${res.status}).`);
              return res.json();
            };

            const rows = await sql(`
              select id, to_char(created_at at time zone 'UTC', 'YYYY-MM-DD HH24:MI') as at,
                     evidence is not null as kept
              from public.reports where notified_at is null
              order by created_at limit 100`);
            if (!rows.length) {
              core.info("No new reports.");
              return;
            }
            const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
            const ids = rows.map((r) => r.id).filter((id) => uuid.test(id));
            const list = ids.map((id) => `'${id}'`).join(", ");
            const n = ids.length;
            if (!n) throw new Error("Unexpected report ids from Supabase.");
            const { owner, repo } = context.repo;
            const body = [
              `${n} new report(s), review in Supabase (SQL Editor) within 24 hours: docs/REPORTS.md.`,
              "",
              "```sql",
              `select * from public.reports where id in (${list});`,
              "```",
              "",
              ...rows.filter((r) => uuid.test(r.id))
                .map((r) => `- \`${r.id}\` · ${r.at} UTC · ${r.kept ? "doodle kept as evidence" : "no doodle"}`),
              "",
              "Close this issue once reviewed.",
            ].join("\n");
            const issue = await github.rest.issues.create({
              owner, repo, title: `${n} new report(s) to review`, body, assignees: [owner],
            }).catch(() => github.rest.issues.create({ owner, repo, title: `${n} new report(s) to review`, body }));
            await sql(`update public.reports set notified_at = now() where id in (${list}) and notified_at is null`);
            core.notice(`Opened #${issue.data.number} for ${n} new report(s).`);
