name: Stand-in friend

# Manual: a temporary friend for recording the app alone. Make an invite in the
# app, run this with the code, and it connects and pssts you back. Its account
# is deleted when the time is up. See scripts/stand_in_friend.py.
on:
  workflow_dispatch:
    inputs:
      code:
        description: Invite code from the app
        required: true
      name:
        description: Friend's name
        default: Zoe
      minutes:
        description: How long it stays (max 30)
        default: "10"
      target:
        type: choice
        options: [production, development]
        default: production

permissions:
  contents: read

jobs:
  friend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'production' || 'development' }}
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ inputs.target == 'production' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF }}
    steps:
      # First, before any step prints its env: hide the invite code (as typed, and
      # trimmed/upper-cased as the script uses it). Read from the event file, not
      # from env or an expression, so neither this step's header nor its script
      # text holds the code; later steps' env headers then show ***.
      - name: Hide the invite code
        run: |
          python3 -c '
          import json, os
          code = json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs", {}).get("code") or ""
          for value in {code, code.strip(), code.strip().upper()}:
              if value.strip():
                  print("::add-mask::" + value)
          '
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest
      - name: Connect and psst back
        env:
          INVITE_CODE: ${{ inputs.code }}
          FRIEND_NAME: ${{ inputs.name }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          [ "$MINUTES" -le 30 ] 2>/dev/null || MINUTES=30
          SUPABASE_ANON_KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | python3 -c "
          import json, sys
          keys = json.load(sys.stdin)
          pick = next((k for k in keys if k.get('name') == 'anon'), None) \
              or next((k for k in keys if k.get('type') == 'publishable'), None)
          print(pick['api_key'] if pick else '')
          ")
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::Couldn't read the project's anon key"; exit 1; fi
          echo "::add-mask::$SUPABASE_ANON_KEY"
          SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" MINUTES="$MINUTES" python3 scripts/stand_in_friend.py
