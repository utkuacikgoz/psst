name: TestFlight

# Manual only: builds a signed release pointed at the chosen backend and uploads
# it to App Store Connect for TestFlight (and, from there, App Store release).
# Production reads SUPABASE_PROJECT_REF_PROD (and SUPABASE_ACCESS_TOKEN_PROD if
# set); see deploy-backend.yml.
#
# Repository secrets needed, besides the backend ones already set:
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      full text of that key's .p8 file
# Reused: APNS_TEAM_ID (team), APNS_BUNDLE_ID (bundle ID),
#         SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF (to read the anon key).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which backend the build talks to
        type: choice
        options: [production, development]
        default: production

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      PROD_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ inputs.target == 'production' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: scripts/select_xcode.sh

      - name: Check that every secret is set
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID BUNDLE_ID \
                      SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          if [ "$TARGET" = production ] && [ -z "$PROD_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF_PROD is not set; a production build must not point at development."
            missing=1
          fi
          exit $missing

      - name: Write the App Store Connect key
        run: |
          body=$(sed '/-----/d' <<<"$ASC_KEY_P8" | tr -d ' \r\n\t')
          if ! [[ "$body" =~ ^[A-Za-z0-9+/]+=*$ ]] || [ ${#body} -lt 150 ]; then
            echo "::error::ASC_KEY_P8 doesn't look like a .p8 key. Paste the full text of AuthKey_XXXXXXXXXX.p8."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(fold -w 64 <<<"$body")" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Asks App Store Connect directly, so a revoked or mismatched key fails
      # here with Apple's own answer instead of as a signing error later.
      - name: Check the App Store Connect key
        run: |
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/asc/bin/python" - <<'EOF'
          import json, os, time, urllib.error, urllib.request
          import jwt
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600,
               "aud": "appstoreconnect-v1"},
              open(os.environ["KEY_PATH"]).read(), algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          request = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1",
                                           headers={"Authorization": f"Bearer {token}"})
          try:
              urllib.request.urlopen(request, timeout=30)
              print("App Store Connect accepted the key.")
          except urllib.error.HTTPError as error:
              detail = json.loads(error.read() or b"{}").get("errors", [{}])[0]
              print(f"::error::App Store Connect refused the key ({error.code} {detail.get('code')}): "
                    f"{detail.get('detail')} Check that ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 all belong "
                    "to one active key in App Store Connect → Users and Access → Integrations.")
              raise SystemExit(1)

          # The App IDs Xcode will sign, and the capabilities each has. Xcode
          # can't add capabilities with an API key, so they must exist already.
          # The widget is off for now (not embedded), so only the app is checked.
          needs = {"app": ["PUSH_NOTIFICATIONS", "APP_GROUPS", "ASSOCIATED_DOMAINS"]}
          missing = False
          for role, identifier in (("app", os.environ["BUNDLE_ID"]),):
              url = ("https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]="
                     f"{identifier}&include=bundleIdCapabilities&limit=5")
              body = json.load(urllib.request.urlopen(
                  urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"}), timeout=30))
              exact = [b for b in body["data"] if b["attributes"]["identifier"] == identifier]
              if not exact:
                  print(f"::error::The {role} App ID ({role == 'widget' and 'your bundle ID + .widget' or 'your bundle ID'}) "
                        "isn't registered. Add it in developer.apple.com → Identifiers.")
                  missing = True
                  continue
              ids = {r["id"] for r in exact[0]["relationships"]["bundleIdCapabilities"].get("data", [])}
              have = sorted(i["attributes"]["capabilityType"] for i in body.get("included", []) if i["id"] in ids)
              lacking = [c for c in needs[role] if c not in have]
              print(f"{role} App ID: registered; capabilities {', '.join(have) or 'none'}")
              if lacking:
                  print(f"::error::The {role} App ID is missing: {', '.join(lacking)}. Tick them in developer.apple.com → Identifiers.")
                  missing = True
          raise SystemExit(1 if missing else 0)
          EOF

      - name: Point the build at the ${{ inputs.target }} backend
        run: |
          # One Management API call instead of installing the Supabase CLI.
          ANON=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" | python3 -c "
          import json, sys
          keys = json.load(sys.stdin)
          pick = next((k for k in keys if k.get('name') == 'anon'), None) \
              or next((k for k in keys if k.get('type') == 'publishable'), None)
          print(pick['api_key'] if pick else '')
          ")
          if [ -z "$ANON" ]; then echo "::error::Couldn't read the project's anon key"; exit 1; fi
          echo "::add-mask::$ANON"
          cat > Config/Secrets.xcconfig <<EOF
          PSST_SUPABASE_HOST = $SUPABASE_PROJECT_REF.supabase.co
          PSST_SUPABASE_ANON_KEY = $ANON
          DEVELOPMENT_TEAM = $TEAM_ID
          PSST_APP_BUNDLE_ID = $BUNDLE_ID
          CODE_SIGN_ENTITLEMENTS = Config/Psst.entitlements
          EOF

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Psst.xcodeproj -scheme Psst -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Psst.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Psst.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER ($TARGET backend). It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)."

      - name: Remove the key
        if: always()
        run: rm -f "$KEY_PATH"
